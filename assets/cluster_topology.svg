<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#06080E" />
    </linearGradient>

    <!-- Glass Slate Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="meshGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#00FF9D" />
    </linearGradient>

    <filter id="glowPoint" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes moveRight {
      0% { cx: 240px; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 600px; opacity: 0; }
    }
    @keyframes moveRight2 {
      0% { cx: 600px; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 960px; opacity: 0; }
    }
    .flow-dot1 {
      animation: moveRight 3s linear infinite;
    }
    .flow-dot2 {
      animation: moveRight2 3s linear infinite 1.5s;
    }
  </style>

  <!-- Container Box -->
  <rect width="1200" height="340" rx="12" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Top Encrypted Tailscale Mesh Banner -->
  <g transform="translate(260, 20)">
    <rect width="680" height="42" rx="21" fill="#111827" stroke="url(#meshGradient)" stroke-width="1.5" />
    <circle cx="28" cy="21" r="5" fill="#00F0FF" />
    <text x="340" y="26" text-anchor="middle" fill="#F8FAFC" class="mono" font-size="12" font-weight="800" letter-spacing="2.5">
      ENCRYPTED TAILSCALE MESH NETWORK (100.X.X.X) // ZERO-TRUST
    </text>
    <circle cx="652" cy="21" r="5" fill="#7C3AED" />
  </g>

  <!-- Data Flow Bus Line -->
  <line x1="240" y1="62" x2="240" y2="86" stroke="#00F0FF" stroke-width="2" />
  <line x1="600" y1="62" x2="600" y2="86" stroke="#7C3AED" stroke-width="2" />
  <line x1="960" y1="62" x2="960" y2="86" stroke="#00FF9D" stroke-width="2" />

  <!-- Horizontal Inter-Node Data Bus -->
  <line x1="240" y1="86" x2="960" y2="86" stroke="#1E293B" stroke-width="2" stroke-dasharray="4,6" />

  <!-- Animated Data Flow Glowing Packets -->
  <circle cy="86" r="4.5" fill="#00F0FF" filter="url(#glowPoint)" class="flow-dot1" />
  <circle cy="86" r="4.5" fill="#7C3AED" filter="url(#glowPoint)" class="flow-dot2" />

  <!-- ==================== NODE 01: CONTROL & DEV ==================== -->
  <g transform="translate(48, 100)">
    <rect width="344" height="216" rx="10" fill="url(#cardGrad1)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1.2" />
    
    <!-- Card Header Pill -->
    <rect x="18" y="18" width="308" height="32" rx="6" fill="#0E1626" />
    <circle cx="34" cy="34" r="4.5" fill="#00F0FF" />
    <text x="48" y="38" fill="#00F0FF" class="mono" font-size="11.5" font-weight="800" letter-spacing="1">
      NODE 01 — CONTROL &amp; DEV
    </text>

    <!-- Hardware Badge -->
    <text x="20" y="74" fill="#F8FAFC" class="mono" font-size="13" font-weight="800">
      RTX-3070 Workstation
    </text>
    <text x="20" y="92" fill="#38BDF8" class="mono" font-size="10.5" font-weight="600">
      NVIDIA RTX 3070 (8GB NVENC p7) // Win 11 Pro
    </text>

    <line x1="20" y1="106" x2="324" y2="106" stroke="#1E293B" stroke-width="1" />

    <!-- Core Roles -->
    <text x="20" y="128" fill="#64748B" class="mono" font-size="10" font-weight="700">CORE ROLES &amp; PIPELINES:</text>
    
    <text x="20" y="148" fill="#F8FAFC" class="sans" font-size="12" font-weight="600">• Skill Engineering &amp; Autonomous Agents</text>
    <text x="20" y="168" fill="#F8FAFC" class="sans" font-size="12" font-weight="600">• Remotion Studio &amp; Programmatic Video</text>
    <text x="20" y="188" fill="#F8FAFC" class="sans" font-size="12" font-weight="600">• Playwright &amp; GitHub Sync Engine</text>

    <circle cx="320" cy="198" r="3" fill="#00F0FF" />
  </g>

  <!-- ==================== NODE 02: RENDER ENGINE ==================== -->
  <g transform="translate(428, 100)">
    <rect width="344" height="216" rx="10" fill="url(#cardGrad1)" stroke="rgba(124, 58, 237, 0.4)" stroke-width="1.2" />
    
    <!-- Card Header Pill -->
    <rect x="18" y="18" width="308" height="32" rx="6" fill="#1A1333" />
    <circle cx="34" cy="34" r="4.5" fill="#7C3AED" />
    <text x="48" y="38" fill="#A855F7" class="mono" font-size="11.5" font-weight="800" letter-spacing="1">
      NODE 02 — RENDER ENGINE
    </text>

    <!-- Hardware Badge -->
    <text x="20" y="74" fill="#F8FAFC" class="mono" font-size="13" font-weight="800">
      Apple Silicon M2
    </text>
    <text x="20" y="92" fill="#C084FC" class="mono" font-size="10.5" font-weight="600">
      h264_videotoolbox // macOS Headless Cut
    </text>

    <line x1="20" y1="106" x2="324" y2="106" stroke="#1E293B" stroke-width="1" />

    <!-- Core Roles -->
    <text x="20" y="128" fill="#64748B" class="mono" font-size="10" font-weight="700">CORE ROLES &amp; PIPELINES:</text>
    
    <text x="20" y="148" fill="#F8FAFC" class="sans" font-size="12" font-weight="600">• Hardware VideoToolbox Multi-Pass</text>
    <text x="20" y="168" fill="#F8FAFC" class="sans" font-size="12" font-weight="600">• Whisper ASR &amp; Acoustic Deduplication</text>
    <text x="20" y="188" fill="#F8FAFC" class="sans" font-size="12" font-weight="600">• High-Throughput Cinematic Pipeline</text>

    <circle cx="320" cy="198" r="3" fill="#7C3AED" />
  </g>

  <!-- ==================== NODE 03: 24/7 ORCHESTRATOR ==================== -->
  <g transform="translate(808, 100)">
    <rect width="344" height="216" rx="10" fill="url(#cardGrad1)" stroke="rgba(0, 255, 157, 0.35)" stroke-width="1.2" />
    
    <!-- Card Header Pill -->
    <rect x="18" y="18" width="308" height="32" rx="6" fill="#0C241B" />
    <circle cx="34" cy="34" r="4.5" fill="#00FF9D" />
    <text x="48" y="38" fill="#00FF9D" class="mono" font-size="11.5" font-weight="800" letter-spacing="1">
      NODE 03 — 24/7 ORCHESTRATOR
    </text>

    <!-- Hardware Badge -->
    <text x="20" y="74" fill="#F8FAFC" class="mono" font-size="13" font-weight="800">
      Raspberry Pi 5
    </text>
    <text x="20" y="92" fill="#34D399" class="mono" font-size="10.5" font-weight="600">
      Broadcom BCM2712 Quad-Core // Debian ARM64
    </text>

    <line x1="20" y1="106" x2="324" y2="106" stroke="#1E293B" stroke-width="1" />

    <!-- Core Roles -->
    <text x="20" y="128" fill="#64748B" class="mono" font-size="10" font-weight="700">CORE ROLES &amp; PIPELINES:</text>
    
    <text x="20" y="148" fill="#F8FAFC" class="sans" font-size="12" font-weight="600">• Multi-Channel Job Queue &amp; Watchers</text>
    <text x="20" y="168" fill="#F8FAFC" class="sans" font-size="12" font-weight="600">• SQLite State-Guard &amp; Integrity Check</text>
    <text x="20" y="188" fill="#F8FAFC" class="sans" font-size="12" font-weight="600">• Instant Telegram Delivery (@R23piBot)</text>

    <circle cx="320" cy="198" r="3" fill="#00FF9D" />
  </g>
</svg>
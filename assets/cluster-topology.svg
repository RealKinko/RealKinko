<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="100%" height="370">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .node-title { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
    .node-label { font-size: 10px; font-weight: 600; fill: #64748B; letter-spacing: 1px; }
    .node-val { font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>

  <!-- Container Box -->
  <rect width="900" height="370" rx="8" fill="#030508" stroke="#1E293B" stroke-width="1.5" />

  <!-- Top Mesh Network Header -->
  <rect x="180" y="20" width="540" height="42" rx="6" fill="#0B132B" stroke="#00F0FF" stroke-width="1.5" filter="url(#nodeGlow)" />
  <text x="450" y="46" text-anchor="middle" fill="#00F0FF" class="mono" font-size="12" font-weight="800" letter-spacing="2.5">
    SECURE ENCRYPTED MESH NETWORK (WIREGUARD / TAILSCALE)
  </text>

  <!-- Bus Distribution Lines -->
  <line x1="450" y1="62" x2="450" y2="92" stroke="#00F0FF" stroke-width="2" />
  <line x1="160" y1="92" x2="740" y2="92" stroke="#00F0FF" stroke-width="2" />
  
  <!-- Drops to Nodes -->
  <line x1="160" y1="92" x2="160" y2="120" stroke="#00F0FF" stroke-width="2" />
  <line x1="450" y1="92" x2="450" y2="120" stroke="#00F0FF" stroke-width="2" />
  <line x1="740" y1="92" x2="740" y2="120" stroke="#00F0FF" stroke-width="2" />

  <polygon points="160,123 156,115 164,115" fill="#00F0FF" />
  <polygon points="450,123 446,115 454,115" fill="#00F0FF" />
  <polygon points="740,123 736,115 744,115" fill="#00F0FF" />

  <!-- ==================== NODE 01 ==================== -->
  <g transform="translate(30, 125)">
    <rect width="260" height="175" rx="6" fill="url(#panelGrad)" stroke="#38BDF8" stroke-width="1.5" />
    <path d="M 0 0 L 260 0 L 260 28 L 0 28 Z" fill="#0E1E38" rx="6" />
    <circle cx="16" cy="14" r="4" fill="#38BDF8" />
    <text x="28" y="18" fill="#38BDF8" class="mono node-title">NODE 01: HOST &amp; COMPUTE</text>
    
    <text x="15" y="48" class="mono node-label">ID       :</text>
    <text x="75" y="48" class="mono node-val">DESKTOP-VTN4A9S</text>
    <text x="15" y="68" class="mono node-label">OS       :</text>
    <text x="75" y="68" class="mono node-val">Windows 11 Pro</text>
    <text x="15" y="88" class="mono node-label">ACCEL    :</text>
    <text x="75" y="88" class="mono node-val" fill="#76B900" font-weight="700">RTX 3070 (8GB VRAM)</text>
    <text x="15" y="108" class="mono node-label">ROLE     :</text>
    <text x="75" y="108" class="mono node-val">Heavy Neural Inference,</text>
    <text x="75" y="124" class="mono node-val">Whisper VAD, Dev Studio</text>
    <text x="15" y="146" class="mono node-label">ENCODER  :</text>
    <text x="75" y="146" class="mono node-val">h264_nvenc (p7 / Low Lat)</text>
    <text x="15" y="164" class="mono node-label">AUTH     :</text>
    <text x="75" y="164" class="mono node-val">ed25519-sk host key</text>
  </g>

  <!-- ==================== NODE 02 ==================== -->
  <g transform="translate(320, 125)">
    <rect width="260" height="175" rx="6" fill="url(#panelGrad)" stroke="#FFB800" stroke-width="1.5" />
    <path d="M 0 0 L 260 0 L 260 28 L 0 28 Z" fill="#261E0A" rx="6" />
    <circle cx="16" cy="14" r="4" fill="#FFB800" />
    <text x="28" y="18" fill="#FFB800" class="mono node-title">NODE 02: APPLE RENDER</text>
    
    <text x="15" y="48" class="mono node-label">ID       :</text>
    <text x="75" y="48" class="mono node-val">M2-ENGINE</text>
    <text x="15" y="68" class="mono node-label">OS       :</text>
    <text x="75" y="68" class="mono node-val">macOS (Apple Silicon)</text>
    <text x="15" y="88" class="mono node-label">SILICON  :</text>
    <text x="75" y="88" class="mono node-val" fill="#F59E0B" font-weight="700">M2 Media Engine</text>
    <text x="15" y="108" class="mono node-label">ROLE     :</text>
    <text x="75" y="108" class="mono node-val">Headless Hardware Cut,</text>
    <text x="75" y="124" class="mono node-val">Remotion Studio Synthesis</text>
    <text x="15" y="146" class="mono node-label">ENCODER  :</text>
    <text x="75" y="146" class="mono node-val">h264_videotoolbox</text>
    <text x="15" y="164" class="mono node-label">DEPLOY   :</text>
    <text x="75" y="164" class="mono node-val">mac-mini-deploy key</text>
  </g>

  <!-- ==================== NODE 03 ==================== -->
  <g transform="translate(610, 125)">
    <rect width="260" height="175" rx="6" fill="url(#panelGrad)" stroke="#00FF9D" stroke-width="1.5" />
    <path d="M 0 0 L 260 0 L 260 28 L 0 28 Z" fill="#0A2216" rx="6" />
    <circle cx="16" cy="14" r="4" fill="#00FF9D" />
    <text x="28" y="18" fill="#00FF9D" class="mono node-title">NODE 03: ORCHESTRATION</text>
    
    <text x="15" y="48" class="mono node-label">ID       :</text>
    <text x="75" y="48" class="mono node-val">PI5-DIRIGENT</text>
    <text x="15" y="68" class="mono node-label">OS       :</text>
    <text x="75" y="68" class="mono node-val">Linux (ARM64 Debian)</text>
    <text x="15" y="88" class="mono node-label">CPU      :</text>
    <text x="75" y="88" class="mono node-val" fill="#10B981" font-weight="700">Broadcom BCM2712</text>
    <text x="15" y="108" class="mono node-label">ROLE     :</text>
    <text x="75" y="108" class="mono node-val">24/7 Watcher, n8n Core,</text>
    <text x="75" y="124" class="mono node-val">Instant Telegram Delivery</text>
    <text x="15" y="146" class="mono node-label">GATEWAY  :</text>
    <text x="75" y="146" class="mono node-val">Bot API (@R23piBot)</text>
    <text x="15" y="164" class="mono node-label">DAEMON   :</text>
    <text x="75" y="164" class="mono node-val">systemd autonomous units</text>
  </g>

  <!-- Bottom Sync Footer -->
  <line x1="160" y1="300" x2="160" y2="320" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="450" y1="300" x2="450" y2="320" stroke="#FFB800" stroke-width="1.5" />
  <line x1="740" y1="300" x2="740" y2="320" stroke="#00FF9D" stroke-width="1.5" />
  <line x1="160" y1="320" x2="740" y2="320" stroke="#64748B" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="450" y1="320" x2="450" y2="335" stroke="#64748B" stroke-width="1.5" />

  <rect x="220" y="335" width="460" height="26" rx="4" fill="#0B1120" stroke="#334155" stroke-width="1" />
  <text x="450" y="352" text-anchor="middle" fill="#94A3B8" class="mono" font-size="10" font-weight="600" letter-spacing="1">
    SYNCHRONIZATION: PRIVATE REPO [ Renziac/VIDEO_STUDIO ]
  </text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#06080E" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Glass Slate Highlight -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.4" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Tech Grid -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.35)); }
      50% { opacity: 1; filter: drop-shadow(0 0 24px rgba(0, 240, 255, 0.75)); }
    }
    @keyframes statusDot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .pulsing-title {
      animation: pulseGlow 4s infinite ease-in-out;
    }
    .status-dot {
      animation: statusDot 2s infinite ease-in-out;
      transform-origin: 72px 267px;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
  </style>

  <!-- Canvas Container with Glass Border -->
  <rect width="1200" height="320" rx="12" fill="url(#bgGrad)" stroke="url(#glassBorder)" stroke-width="1.5" />
  <rect width="1200" height="320" rx="12" fill="url(#techGrid)" />
  <rect width="1200" height="320" rx="12" fill="url(#ambientGlow)" />

  <!-- Outer Corner Brackets (Precision HUD) -->
  <!-- Top Left -->
  <path d="M 24 54 L 24 24 L 54 24" fill="none" stroke="#00F0FF" stroke-width="2.5" />
  <line x1="60" y1="24" x2="160" y2="24" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3" />
  
  <!-- Top Right -->
  <path d="M 1146 24 L 1176 24 L 1176 54" fill="none" stroke="#7C3AED" stroke-width="2.5" />
  <line x1="1040" y1="24" x2="1140" y2="24" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.3" />

  <!-- Bottom Left -->
  <path d="M 24 266 L 24 296 L 54 296" fill="none" stroke="#00F0FF" stroke-width="2.5" />
  
  <!-- Bottom Right -->
  <path d="M 1146 296 L 1176 296 L 1176 266" fill="none" stroke="#7C3AED" stroke-width="2.5" />

  <!-- Eyebrow Tag -->
  <g transform="translate(600, 72)">
    <text text-anchor="middle" fill="#00F0FF" class="mono" font-size="13" font-weight="700" letter-spacing="4">
      SYSTEM ARCHITECT // AI &amp; AUTONOMOUS PIPELINES
    </text>
  </g>

  <!-- Main Title: RENZIAC -->
  <g transform="translate(600, 148)" class="pulsing-title">
    <text text-anchor="middle" fill="url(#titleGrad)" filter="url(#neonBloom)" class="mono" font-size="62" font-weight="900" letter-spacing="22">
      RENZIAC
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 196)">
    <text text-anchor="middle" fill="#94A3B8" class="sans" font-size="15.5" font-weight="500" letter-spacing="0.5">
      Designing self-scaling content engines, distributed compute clusters &amp; high-retention media systems.
    </text>
  </g>

  <!-- Bottom Status-Pill (Unten Links) -->
  <g transform="translate(54, 248)">
    <rect width="320" height="38" rx="19" fill="#111827" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="22" cy="19" r="4.5" fill="#00FF9D" class="status-dot" />
    <text x="36" y="24" fill="#F8FAFC" class="mono" font-size="11.5" font-weight="700" letter-spacing="1.5">
      CLUSTER ONLINE  |  NODE: AACHEN, DE
    </text>
  </g>

  <!-- Bottom Right Protocol Pill -->
  <g transform="translate(860, 248)">
    <rect width="286" height="38" rx="19" fill="#111827" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="20" cy="19" r="4" fill="#7C3AED" />
    <text x="34" y="24" fill="#A855F7" class="mono" font-size="11" font-weight="700" letter-spacing="2">
      ED25519-SK // ENCRYPTED MESH
    </text>
  </g>

</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a" />
      <stop offset="50%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>

    <!-- Neon Cyan / Amber Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .pulsing {
      animation: pulseDot 2.5s infinite ease-in-out;
      transform-origin: 825px 35px;
    }
    .mono-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }
  </style>

  <!-- Frame Background -->
  <rect width="900" height="240" rx="10" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="900" height="240" rx="10" fill="url(#cyberGrid)" />

  <!-- Outer Sci-Fi HUD Border Accents -->
  <!-- Top-Left Bracket -->
  <path d="M 15 40 L 15 15 L 40 15" fill="none" stroke="#00F0FF" stroke-width="2.5" />
  <line x1="45" y1="15" x2="120" y2="15" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4" />
  
  <!-- Top-Right Bracket -->
  <path d="M 860 15 L 885 15 L 885 40" fill="none" stroke="#00F0FF" stroke-width="2.5" />
  <line x1="780" y1="15" x2="855" y2="15" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4" />

  <!-- Bottom-Left Bracket -->
  <path d="M 15 200 L 15 225 L 40 225" fill="none" stroke="#00F0FF" stroke-width="2.5" />
  <line x1="45" y1="225" x2="120" y2="225" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4" />

  <!-- Bottom-Right Bracket -->
  <path d="M 860 225 L 885 225 L 885 200" fill="none" stroke="#00F0FF" stroke-width="2.5" />
  <line x1="780" y1="225" x2="855" y2="225" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4" />

  <!-- HUD Telemetry Top Bar -->
  <text x="35" y="38" fill="#64748B" class="mono-font" font-size="11" font-weight="600" letter-spacing="1.5">
    [NODE: AACHEN-EU // 50.7753° N, 6.0839° E]
  </text>
  <text x="380" y="38" fill="#00F0FF" class="mono-font" font-size="11" font-weight="700" letter-spacing="2" opacity="0.9">
    SECURE MESH // ED25519-SK
  </text>
  
  <!-- Online Status Indicator -->
  <circle cx="820" cy="35" r="4" fill="#00FF9D" class="pulsing" />
  <text x="832" y="38" fill="#00FF9D" class="mono-font" font-size="11" font-weight="700" letter-spacing="1.5">
    ACTIVE
  </text>

  <!-- Horizontal Divider Line with Neon Glow -->
  <line x1="30" y1="52" x2="870" y2="52" stroke="url(#cyanLine)" stroke-width="1.5" />

  <!-- Main Identity Callout -->
  <text x="450" y="116" text-anchor="middle" fill="url(#textGrad)" filter="url(#glow)" class="mono-font" font-size="38" font-weight="900" letter-spacing="14">
    RENZIAC
  </text>

  <!-- Sub-Heading / Architecture Role -->
  <text x="450" y="150" text-anchor="middle" fill="#E2E8F0" class="mono-font" font-size="13" font-weight="700" letter-spacing="4">
    AUTONOMOUS SYSTEMS ARCHITECT // DISTRIBUTED NEURAL CLUSTER
  </text>

  <!-- Lower Telemetry Modules (Cluster Nodes) -->
  <line x1="60" y1="172" x2="840" y2="172" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Node 01 -->
  <rect x="55" y="184" width="240" height="36" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
  <text x="70" y="199" fill="#38BDF8" class="mono-font" font-size="10" font-weight="700" letter-spacing="1">NODE 01: HOST &amp; COMPUTE</text>
  <text x="70" y="212" fill="#64748B" class="mono-font" font-size="9" font-weight="500">RTX 3070 8GB NVENC // Whisper VAD</text>

  <!-- Node 02 -->
  <rect x="330" y="184" width="240" height="36" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
  <text x="345" y="199" fill="#FFB800" class="mono-font" font-size="10" font-weight="700" letter-spacing="1">NODE 02: APPLE RENDER</text>
  <text x="345" y="212" fill="#64748B" class="mono-font" font-size="9" font-weight="500">M2 VideoToolbox // Remotion Studio</text>

  <!-- Node 03 -->
  <rect x="605" y="184" width="240" height="36" rx="4" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
  <text x="620" y="199" fill="#00FF9D" class="mono-font" font-size="10" font-weight="700" letter-spacing="1">NODE 03: ORCHESTRATION</text>
  <text x="620" y="212" fill="#64748B" class="mono-font" font-size="9" font-weight="500">Pi 5 ARM64 // Telegram @R23piBot</text>

</svg>
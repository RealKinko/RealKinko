<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#06080E" />
    </linearGradient>

    <linearGradient id="colCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0A0E17" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .item-pill {
      font-size: 11px;
      font-weight: 600;
      fill: #F8FAFC;
    }
  </style>

  <!-- Container Box -->
  <rect width="1200" height="220" rx="12" fill="url(#matrixBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- ==================== COLUMN 01 ==================== -->
  <g transform="translate(36, 24)">
    <rect width="260" height="172" rx="8" fill="url(#colCardBg)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.2" />
    <path d="M 0 0 L 260 0 L 260 36 L 0 36 Z" fill="#0E1626" rx="8" />
    <circle cx="20" cy="18" r="4" fill="#00F0FF" />
    <text x="32" y="22" fill="#00F0FF" class="mono" font-size="11" font-weight="800" letter-spacing="1">
      01 // AI &amp; VISION
    </text>
    
    <text x="20" y="64" class="sans item-pill">• Whisper ASR (Word-Align)</text>
    <text x="20" y="92" class="sans item-pill">• OpenCV &amp; Vision Pipelines</text>
    <text x="20" y="120" class="sans item-pill">• Autonomous LLM Agents</text>
    <text x="20" y="148" class="sans item-pill">• Deterministic Prompt Systems</text>
  </g>

  <!-- ==================== COLUMN 02 ==================== -->
  <g transform="translate(324, 24)">
    <rect width="260" height="172" rx="8" fill="url(#colCardBg)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
    <path d="M 0 0 L 260 0 L 260 36 L 0 36 Z" fill="#0D1C2E" rx="8" />
    <circle cx="20" cy="18" r="4" fill="#38BDF8" />
    <text x="32" y="22" fill="#38BDF8" class="mono" font-size="11" font-weight="800" letter-spacing="1">
      02 // MEDIA ENGINE
    </text>
    
    <text x="20" y="64" class="sans item-pill">• FFmpeg (NVENC p7 Master)</text>
    <text x="20" y="92" class="sans item-pill">• Apple VideoToolbox HW Cut</text>
    <text x="20" y="120" class="sans item-pill">• Remotion Kinetic Typography</text>
    <text x="20" y="148" class="sans item-pill">• Playwright Headless Render</text>
  </g>

  <!-- ==================== COLUMN 03 ==================== -->
  <g transform="translate(612, 24)">
    <rect width="260" height="172" rx="8" fill="url(#colCardBg)" stroke="rgba(124, 58, 237, 0.35)" stroke-width="1.2" />
    <path d="M 0 0 L 260 0 L 260 36 L 0 36 Z" fill="#1C1333" rx="8" />
    <circle cx="20" cy="18" r="4" fill="#7C3AED" />
    <text x="32" y="22" fill="#A855F7" class="mono" font-size="11" font-weight="800" letter-spacing="1">
      03 // INFRA &amp; MESH
    </text>
    
    <text x="20" y="64" class="sans item-pill">• Linux (Debian ARM64) / Win 11</text>
    <text x="20" y="92" class="sans item-pill">• macOS Apple Silicon Daemon</text>
    <text x="20" y="120" class="sans item-pill">• Tailscale Encrypted Mesh</text>
    <text x="20" y="148" class="sans item-pill">• Docker, WireGuard &amp; SSH</text>
  </g>

  <!-- ==================== COLUMN 04 ==================== -->
  <g transform="translate(900, 24)">
    <rect width="260" height="172" rx="8" fill="url(#colCardBg)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.2" />
    <path d="M 0 0 L 260 0 L 260 36 L 0 36 Z" fill="#241133" rx="8" />
    <circle cx="20" cy="18" r="4" fill="#A855F7" />
    <text x="32" y="22" fill="#C084FC" class="mono" font-size="11" font-weight="800" letter-spacing="1">
      04 // AUTOMATION
    </text>
    
    <text x="20" y="64" class="sans item-pill">• Python (High-Perf Neural)</text>
    <text x="20" y="92" class="sans item-pill">• TypeScript / React 19 Core</text>
    <text x="20" y="120" class="sans item-pill">• n8n Autonomous Event Flow</text>
    <text x="20" y="148" class="sans item-pill">• SQLite State Guard &amp; CI/CD</text>
  </g>
</svg>
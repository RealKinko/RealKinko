    <text x="14" y="62" class="mono stage-desc">• 1080x1920 @ 60 FPS zero-latency</text>
    <text x="14" y="78" class="mono stage-desc">• Ultra-fast multi-pass rendering</text>
  </g>

  <!-- 3 Stages Bottom Row -->
  <!-- Stage 04 -->
  <g transform="translate(25, 168)">
    <rect width="265" height="96" rx="6" fill="url(#pipeGrad)" stroke="#F59E0B" stroke-width="1.2" />
    <text x="14" y="24" fill="#F59E0B" class="mono stage-title">[04] PSYCHO-ACOUSTIC MASTERING</text>

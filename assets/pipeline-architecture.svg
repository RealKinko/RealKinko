    <text x="14" y="78" class="mono stage-desc">• Auto-generated viral preview covers</text>
  </g>

  <!-- Stage 06 -->
  <g transform="translate(605, 168)">
    <rect width="265" height="96" rx="6" fill="url(#pipeGrad)" stroke="#00FF9D" stroke-width="1.2" />
    <text x="14" y="24" fill="#00FF9D" class="mono stage-title">[06] AUTONOMOUS EDGE DISPATCH</text>
    <text x="14" y="44" class="mono stage-tech">Pi 5 Daemon // Telegram API</text>
    <text x="14" y="62" class="mono stage-desc">• Instant push to @R23piBot (6410502244)</text>

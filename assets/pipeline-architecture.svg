  <rect width="900" height="280" rx="8" fill="#030508" stroke="#1E293B" stroke-width="1.5" />

  <!-- Pipeline Title -->
  <text x="30" y="32" fill="#00F0FF" class="mono" font-size="12" font-weight="800" letter-spacing="2">
    NEURO-PSYCHOLOGICAL VIRAL VIDEO PIPELINE // AUTONOMOUS VECTOR MATRIX
  </text>
  <text x="730" y="32" fill="#64748B" class="mono" font-size="10" font-weight="600" letter-spacing="1">
    SPEC: SKILL_SUITE_V1
  </text>
  <line x1="25" y1="44" x2="875" y2="44" stroke="#1E293B" stroke-width="1" />

  <!-- 3 Stages Top Row -->
  <!-- Stage 01 -->
  <g transform="translate(25, 58)">
    <rect width="265" height="96" rx="6" fill="url(#pipeGrad)" stroke="#38BDF8" stroke-width="1.2" />
    <text x="14" y="24" fill="#38BDF8" class="mono stage-title">[01] NEURAL INGEST &amp; ALIGN</text>
    <text x="14" y="44" class="mono stage-tech">Faster-Whisper // Silero VAD</text>
    <text x="14" y="62" class="mono stage-desc">• Word-level timestamp extraction</text>
    <text x="14" y="78" class="mono stage-desc">• Heuristic "Last Take Wins" dedup</text>
  </g>

  <!-- Stage 02 -->
  <g transform="translate(315, 58)">
    <rect width="265" height="96" rx="6" fill="url(#pipeGrad)" stroke="#00F0FF" stroke-width="1.2" />
    <text x="14" y="24" fill="#00F0FF" class="mono stage-title">[02] KINETIC MOTION SYNTHESIS</text>
    <text x="14" y="44" class="mono stage-tech">Remotion // React 19 // TypeScript</text>
    <text x="14" y="62" class="mono stage-desc">• Dynamic safe-zone bounds (9:16)</text>
    <text x="14" y="78" class="mono stage-desc">• Programmatic typography pops</text>
